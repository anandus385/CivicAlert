<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicAlert | Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            Civic<span>Alert</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="report.html">Report Issue</a></li>
            <li><a href="track.html">Track Complaint</a></li>
            <li><a href="login.html" class="active">Login</a></li>
        </ul>
    </nav>

    <!-- Login Section -->
    <section class="login-section">

        <div class="login-card">

            <h1>Welcome Back</h1>

            <p>
                Login to report and track public infrastructure issues.
            </p>

            <form id="loginForm">

                <div class="input-box">
                    <label>Email Address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember Me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn"
                >
                    Login
                </button>

                <div class="register">
                    Don't have an account?
                    <a href="register.html">
                        Register
                    </a>
                </div>

            </form>

        </div>

    </section>

    
    <script type="module" src="js/auth.js"></script>

</body>
</html>
