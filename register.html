<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicAlert | Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            Civic<span>Alert</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="report.html">Report Issue</a></li>
            <li><a href="track.html">Track Complaint</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <section class="register-section">

        <div class="register-card">

            <h1>Create Account</h1>

            <p>
                Join CivicAlert and help build safer and smarter communities.
            </p>

            <form id="registerForm">

                <div class="input-box">
                    <label>Full Name</label>
                    <input type="text"
                           id="name"
                           placeholder="Enter your full name"
                           required>
                </div>

                <div class="input-box">
                    <label>Email Address</label>
                    <input type="email"
                           id="email"
                           placeholder="Enter your email"
                           required>
                </div>

                <div class="input-box">
                    <label>Phone Number</label>
                    <input type="tel"
                           id="phone"
                           placeholder="Enter your phone number"
                           required>
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password"
                           id="password"
                           placeholder="Create password"
                           required>
                </div>

                <div class="input-box">
                    <label>Confirm Password</label>
                    <input type="password"
                           id="confirmPassword"
                           placeholder="Confirm password"
                           required>
                </div>
                <div class="input-box">

<label>Area Access Code</label>

<input
type="text"
id="areaCode"
placeholder="Enter Area Code"
required>

</div>

                <button type="submit"
                        id="registerBtn"
                        class="register-btn">
                    Create Account
                </button>

                <div class="login-link">
                    Already have an account?
                    <a href="login.html">Login</a>
                </div>

            </form>

        </div>

    </section>

    <script type="module" src="js/auth.js"></script>

</body>
</html>
